general {
    # Route manual and system lock requests through Hyprlock, and make sure
    # suspend never exposes an unlocked session on wake.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # Honor application idle inhibitors, e.g. during video playback or calls.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# Lock and reduce OLED brightness after 5 minutes.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 2%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the OLED panel completely off after 10 minutes.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend after 30 minutes of inactivity.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
