general {
    hide_cursor = true
    immediate_render = true
}

auth {
    pam:enabled = true
    fingerprint:enabled = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(000000)
}

label {
    monitor =
    text = $TIME
    color = rgb(eeeeee)
    font_size = 72
    font_family = Hack
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date "+%A, %d %B"
    color = rgb(8a8a8a)
    font_size = 16
    font_family = Hack
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 56
    outline_thickness = 2
    dots_size = 0.18
    dots_spacing = 0.22
    dots_center = true
    outer_color = rgb(595959)
    inner_color = rgb(111111)
    font_color = rgb(eeeeee)
    font_family = Hack
    fade_on_empty = false
    placeholder_text = <span foreground="##777777">Password</span>
    check_color = rgb(8a8a8a)
    fail_color = rgb(782f2f)
    fail_text = <span foreground="##eeeeee">$FAIL</span>
    capslock_color = rgb(eeeeee)
    rounding = 10
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[!,Layout: de]
    color = rgb(777777)
    font_size = 13
    font_family = Hack
    position = 0, 48
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] sh -c 'printf "%s%% · %s" "$(cat /sys/class/power_supply/BAT0/capacity)" "$(cat /sys/class/power_supply/BAT0/status)"'
    color = rgb(777777)
    font_size = 20
    font_family = Hack
    position = 0, 80
    halign = center
    valign = bottom
}
